<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>SignUp Form</title>
        <link rel="stylesheet" href="style.css">
        <link rel="stylesheet" href="CSS-Reset.css">
    </head>
    <body>
        <main>
            <div class="container">
                <section>
                    <div>
                        <img src="https://images.unsplash.com/photo-1585202900225-6d3ac20a6962?q=80&w=774&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D">
                    </div>
                </section>
                <section>
                    <div>
                        <h2>This is not a real online service! You know you need something like this
                            in your life to help you realize your deepest dreams.
                            Sign up <i>now</i> to get started.
                            <br>
                            <br>
                            You <i>know</i> you want to.
                        </h2>
                    </div>
                    <div class="formdiv">
                        <form action="example.com/path" method="post">
                            <h2>Let's do this!</h2>
                            <br>
                            <label for="first_name">FIRST NAME</label>
                            <input type="text" name="first_name" id="first_name" placeholder="John" required>
                            <label for="last_name">LAST NAME</label>
                            <input type="text" name="last_name" id="last_name" placeholder="Doe" required>
                            <label for="email">EMAIL</label>
                            <input type="email" name="email" id="email" placeholder="example@email.com" required>
                            <label for="phone_num">PHONE NUMBER</label>
                            <input type="text" pattern="[0-9]+([-][0-9]+)*"name="phone_num" id="phone_num" placeholder="888-888-8888" required>
                            <label for="password">PASSWORD</label>
                            <input type="password" minlength="5" maxlength="12" name="password" id="password" required>
                            <label for="confirmPass">CONFIRM PASSWORD</label>
                            <input type="password" minlength="5" maxlength="12" name="ConfirmPass" id="ConfirmPass" required>
                        </form>
                    </div>
                        <button type="submit">Create Account</button>
                        <label>Already have an account?<a href="">Log in</a></label>
                </section>
            </div>
        </main>
    </body>
</html>
